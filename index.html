<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アリア B6 充電時間計算</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1a2330;--sub:#667085;--accent:#0a7cff;--bar:#e3e8ee;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--card:#18202a;--text:#e8edf3;--sub:#93a0b0;--accent:#4da3ff;--bar:#2a3441;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0e1319;--card:#18202a;--text:#e8edf3;--sub:#93a0b0;--accent:#4da3ff;--bar:#2a3441;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.big{font-size:40px;font-weight:700;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=number]{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--bar);background:var(--bg);color:var(--text);box-sizing:border-box}
.row{display:flex;gap:10px}.row>div{flex:1}
.bar{height:14px;background:var(--bar);border-radius:7px;overflow:hidden;position:relative;margin-top:8px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.35}
.now{position:absolute;top:0;bottom:0;background:var(--accent)}
.res{text-align:center}
.res .t{font-size:44px;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bar);font-size:15px}
.kv:first-of-type{border-top:0}
.note{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>⚡ アリア B6 充電時間計算</h1>

<div class="card">
<label>現在の電池残量</label>
<div class="big"><span id="socv">30</span>%</div>
<input type="range" id="soc" min="0" max="99" value="30">
<div class="bar"><div class="fill" id="fill"></div><div class="now" id="now"></div></div>
</div>

<div class="card">
<div class="row">
<div><label>目標 (%)</label><input type="number" id="target" value="80" min="1" max="100"></div>
<div><label>電池容量 (kWh)</label><input type="number" id="cap" value="66" min="10" max="150" step="1"></div>
</div>
<div style="height:10px"></div>
<label>充電器</label>
<select id="ch">
<option value="ac,3">普通充電 3kW (200V)</option>
<option value="ac,6" selected>普通充電 6kW (200V)</option>
<option value="dc,50">急速充電 50kW</option>
<option value="dc,90">急速充電 90kW</option>
<option value="dc,150">急速充電 150kW (車両上限130kW)</option>
</select>
<div style="height:10px"></div>
<label>充電開始時刻(初期値は現在時刻)</label>
<input type="time" id="start">
</div>

<div class="card res">
<div class="note">目標まで</div>
<div class="t" id="time">--</div>
<div class="note" id="fin"></div>
</div>

<div class="card">
<label>充電する時間を入れると、到達する残量がわかります</label>
<div class="row">
<div><label>時間</label><input type="number" id="hh" value="1" min="0" max="48"></div>
<div><label>分</label><input type="number" id="mm" value="0" min="0" max="59"></div>
</div>
<div class="res" style="margin-top:10px">
<div class="note">この時間で充電すると</div>
<div class="t" id="reach">--</div>
<div class="note" id="added"></div>
</div>
</div>

<div class="card">
<div class="kv"><span>充電する電力量</span><b id="kwh">--</b></div>
<div class="kv"><span>平均充電電力</span><b id="avg">--</b></div>
<div class="kv"><span>満充電まで (参考)</span><b id="full">--</b></div>
</div>

<p class="note">※ 目安の計算です。充電効率は普通90%・急速95%、急速は50%以降に出力が徐々に下がる想定です。気温・電池温度・充電器の状態で実際は変わります。電池容量は実際の値に合わせて調整してください。</p>
</main>

<script>
const $=id=>document.getElementById(id);
const CAR_AC=6, CAR_DC=130;
function curve(s){ if(s<50) return 1; if(s<80) return 1-(s-50)/30*0.55; return 0.45-(s-80)/20*0.3; }
function calc(from,to,cap,type,kw){
  const eff = type==='ac'?0.90:0.95;
  const lim = type==='ac'?Math.min(kw,CAR_AC):Math.min(kw,CAR_DC);
  let h=0; const step=0.1;
  for(let s=from;s<to-1e-9;s+=step){
    const p = type==='ac'? lim*eff : Math.max(lim*curve(s),5)*eff;
    h += cap*step/100/p;
  }
  return h;
}
function reachSoc(from,minutes,cap,type,kw){
  const eff = type==='ac'?0.90:0.95;
  const lim = type==='ac'?Math.min(kw,CAR_AC):Math.min(kw,CAR_DC);
  let rem=minutes/60, s=from; const step=0.1;
  while(s<100-1e-9 && rem>0){
    const p = type==='ac'? lim*eff : Math.max(lim*curve(s),5)*eff;
    const dh = cap*step/100/p;
    if(dh>rem){ s+=step*rem/dh; rem=0; break; }
    rem-=dh; s+=step;
  }
  return Math.min(s,100);
}
function fmt(h){ const m=Math.round(h*60); const hh=Math.floor(m/60), mm=m%60; return hh>0?`${hh}時間${mm}分`:`${mm}分`; }
function update(){
  if(!touched){ const n=new Date(); $('start').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
  const soc=+$('soc').value; let tg=Math.min(100,Math.max(1,+$('target').value||80));
  const cap=+$('cap').value||66; const [type,kwS]=$('ch').value.split(','); const kw=+kwS;
  $('socv').textContent=soc;
  { const mins=(+$('hh').value||0)*60+(+$('mm').value||0);
    const r=reachSoc(soc,mins,cap,type,kw);
    $('reach').textContent=r>=99.95?'100%(満充電)':r.toFixed(1)+'%';
    $('added').textContent=`+${(r-soc).toFixed(1)}%(約 ${(cap*(r-soc)/100).toFixed(1)} kWh 充電)`; }
  $('fill').style.width=tg+'%'; $('now').style.width=soc+'%';
  if(soc>=tg){ $('time').textContent='目標到達済み'; $('fin').textContent=''; $('kwh').textContent='0 kWh'; $('avg').textContent='--'; $('full').textContent=fmt(calc(soc,100,cap,type,kw)); return; }
  const h=calc(soc,tg,cap,type,kw);
  const e=cap*(tg-soc)/100;
  $('time').textContent=fmt(h);
  const [sh,sm]=($('start').value||'00:00').split(':').map(Number);
  const st=new Date(); st.setHours(sh,sm,0,0);
  const d=new Date(st.getTime()+h*3600000);
  const p=x=>String(x).padStart(2,'0');
  const nextDay=d.getDate()!==st.getDate()?'(翌日)':'';
  $('fin').textContent=`充電予定 ${p(st.getHours())}:${p(st.getMinutes())} 〜 ${p(d.getHours())}:${p(d.getMinutes())}${nextDay}`;
  $('kwh').textContent=e.toFixed(1)+' kWh';
  $('avg').textContent=(e/h).toFixed(1)+' kW';
  $('full').textContent=fmt(calc(soc,100,cap,type,kw));
}
let touched=false;
$('start').addEventListener('input',()=>{touched=true;});
['soc','target','cap','ch','start','hh','mm'].forEach(i=>$(i).addEventListener('input',update));
update();
</script>
</body>
</html>
